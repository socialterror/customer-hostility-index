name: H06 Batch02 Blind Review Matrix
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - 'h06_temp/make_t0_review_matrix.py'
      - '.github/workflows/h06-review-matrix.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python h06_temp/make_t0_review_matrix.py
      - run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_review
          git diff --cached --quiet || git commit -m "Build H06 batch02 blind review matrix"
          git push
