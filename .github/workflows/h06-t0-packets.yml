name: H06 Blind T0 Evidence Packets
# trigger: 2026-08-18
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - 'h06_temp/build_t0_packets.py'
      - '.github/workflows/h06-t0-packets.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build blind evidence packets from frozen SEC manifest
        run: python h06_temp/build_t0_packets.py
      - name: Commit packets to isolated branch
        run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_packets
          git diff --cached --quiet || git commit -m "Generate H06 blind T0 evidence packets"
          git push
