name: H06 Manifest Verification
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - 'h06_temp/build_t0_packets.py'
      - 'h06_temp/condense_t0_packets.py'
      - '.github/workflows/h06-manifest-verify.yml'
permissions:
  contents: write
jobs:
  packets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build blind T0 evidence packets
        id: packets
        continue-on-error: true
        run: python h06_temp/build_t0_packets.py
      - name: Condense already-extracted blind evidence
        id: digest
        if: steps.packets.outcome == 'success'
        continue-on-error: true
        run: python h06_temp/condense_t0_packets.py
      - name: Commit blind T0 retrieval artifacts
        if: always()
        run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_packets h06_temp/t0_digests
          git diff --cached --quiet || git commit -m "Generate H06 blind T0 retrieval digests"
          git push
      - name: Enforce retrieval gates
        if: steps.packets.outcome != 'success' || steps.digest.outcome != 'success'
        run: exit 1
