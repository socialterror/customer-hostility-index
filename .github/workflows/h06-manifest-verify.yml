name: H06 Manifest Verification

on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - 'h06_temp/build_t0_packets.py'
      - '.github/workflows/h06-manifest-verify.yml'
permissions:
  contents: write
jobs:
  packets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build blind T0 evidence packets
        id: packets
        continue-on-error: true
        run: |
          mkdir -p h06_temp/t0_packets
          python h06_temp/build_t0_packets.py > h06_temp/t0_packets/build_stdout.txt 2> h06_temp/t0_packets/build_stderr.txt
          rc=$?
          echo "exit_code=$rc" > h06_temp/t0_packets/build_status.txt
          exit $rc
      - name: Commit T0 packet outputs and diagnostics
        if: always()
        run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_packets
          git diff --cached --quiet || git commit -m "Persist H06 blind T0 packet batch and diagnostics"
          git push
      - name: Enforce packet gate
        if: steps.packets.outcome != 'success'
        run: exit 1
