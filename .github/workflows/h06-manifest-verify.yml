name: H06 Manifest Verification

on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - 'h06_temp/verify_manifest.py'
      - 'h06_temp/sample.csv.gz.b64'
      - '.github/workflows/h06-manifest-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact H06 F1-F5 manifest
        id: verifier
        continue-on-error: true
        run: python h06_temp/verify_manifest.py
      - name: Commit verification outputs to isolated branch
        if: always()
        run: |
          git config user.name "h06-manifest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/output
          git diff --cached --quiet || git commit -m "Generate H06 manifest verification outputs"
          git push
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h06-manifest-verification
          path: h06_temp/output/*
          if-no-files-found: error
      - name: Enforce freeze gate
        if: steps.verifier.outcome != 'success'
        run: exit 1
