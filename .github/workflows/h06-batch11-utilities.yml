name: H06 Final T0 Master Consolidation
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - '.github/workflows/h06-batch11-utilities.yml'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Consolidate frozen H06 T0 ledgers
        shell: bash
        run: |
          set +e
          python h06_temp/consolidate_t0_master.py > h06_temp/t0_master_consolidation.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> h06_temp/t0_master_consolidation.log
          test "$code" -eq 0
      - name: Commit canonical T0 masters
        run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_scoring/H06_T0_*_FROZEN.csv \
                  h06_temp/t0_scoring/H06_T0_*_FROZEN.json \
                  h06_temp/t0_scoring/H06_T0_FINAL_FREEZE_RECORD.md \
                  h06_temp/t0_scoring/H06_T0_MASTER_CHECKSUMS.txt \
                  h06_temp/t0_scoring/H06_T0_MASTER_FREEZE_STATUS.json \
                  h06_temp/t0_master_consolidation.log
          git diff --cached --quiet || git commit -m "Freeze canonical H06 T0 master ledgers"
          git pull --rebase origin h06-manifest-verification-temp
          git push
