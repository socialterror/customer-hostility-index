name: H06 Final T0 Master Consolidation
on:
  pull_request:
    branches: [h06-runner-base]
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - '.github/workflows/h06-batch11-utilities.yml'
permissions:
  contents: read
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Consolidate frozen H06 T0 ledgers
        run: python h06_temp/consolidate_t0_master.py
      - name: Upload canonical H06 T0 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h06-t0-master
          path: |
            h06_temp/t0_scoring/H06_T0_COMPANY_PREDICTOR_LEDGER_FROZEN.csv
            h06_temp/t0_scoring/H06_T0_COMPANY_PREDICTOR_LEDGER_FROZEN.json
            h06_temp/t0_scoring/H06_T0_SIGNAL_LEDGER_FROZEN.csv
            h06_temp/t0_scoring/H06_T0_SIGNAL_LEDGER_FROZEN.json
            h06_temp/t0_scoring/H06_T0_FINAL_FREEZE_RECORD.md
            h06_temp/t0_scoring/H06_T0_MASTER_CHECKSUMS.txt
            h06_temp/t0_scoring/H06_T0_MASTER_FREEZE_STATUS.json
# isolated-pr-runner
