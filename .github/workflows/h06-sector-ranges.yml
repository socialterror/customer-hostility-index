name: H06 Sector Range Summary
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - 'h06_temp/summarize_sector_ranges.py'
      - '.github/workflows/h06-sector-ranges.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python h06_temp/summarize_sector_ranges.py
      - run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/output/H06_SECTOR_ORDER_RANGES.json
          git diff --cached --quiet || git commit -m "Record H06 sector order ranges"
          git push
