name: H06 Batch05 Financials Freeze
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - 'h06_temp/freeze_batch05_financials.py'
      - '.github/workflows/h06-batch05-freeze.yml'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python h06_temp/freeze_batch05_financials.py
      - run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_scoring
          git diff --cached --quiet || git commit -m "Freeze H06 Batch05 Financials blind T0 scoring"
          git push
