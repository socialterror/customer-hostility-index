name: H06 Condense Blind T0 Packets
# trigger batch03
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - 'h06_temp/condense_t0_packets.py'
      - '.github/workflows/h06-condense.yml'
permissions:
  contents: write
jobs:
  condense:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Condense blind packets
        run: python h06_temp/condense_t0_packets.py
      - name: Commit digests
        run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_digests
          git diff --cached --quiet || git commit -m "Condense H06 blind T0 evidence packets"
          git push
