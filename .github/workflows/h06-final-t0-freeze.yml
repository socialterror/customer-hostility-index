name: H06 Final T0 Freeze
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - '.github/workflows/h06-final-t0-freeze.yml'
      - 'h06_temp/freeze_final41_and_consolidate.py'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python h06_temp/freeze_final41_and_consolidate.py
      - run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_scoring
          git diff --cached --quiet || git commit -m "Freeze final H06 T0 predictors"
          git pull --rebase origin h06-manifest-verification-temp
          git push
