name: H06 Final T0 Freeze
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - '.github/workflows/h06-final-t0-freeze.yml'
      - 'h06_temp/freeze_final41_and_consolidate.py'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run fail-closed freeze and capture diagnostics
        shell: bash
        run: |
          set +e
          python h06_temp/freeze_final41_and_consolidate.py > h06_temp/final_t0_freeze_run.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> h06_temp/final_t0_freeze_run.log
          exit 0
      - name: Commit outputs or diagnostics
        run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_scoring h06_temp/final_t0_freeze_run.log
          git diff --cached --quiet || git commit -m "Run H06 final T0 freeze with diagnostics"
          git pull --rebase origin h06-manifest-verification-temp
          git push
