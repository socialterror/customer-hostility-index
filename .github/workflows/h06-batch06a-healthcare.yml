name: H06 Batch06A Health Care Blind Evidence
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - '.github/workflows/h06-batch06a-healthcare.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          cp h06_temp/build_t0_packets.py /tmp/b06a.py
          sed -i 's/MIN_ORDER=10/MIN_ORDER=99/' /tmp/b06a.py
          sed -i 's/MAX_ORDER=35/MAX_ORDER=112/' /tmp/b06a.py
          sed -i 's/packet_summary_batch02.csv/packet_summary_batch06a.csv/' /tmp/b06a.py
          sed -i "s#ROOT=pathlib.Path(__file__).resolve().parent#ROOT=pathlib.Path('$GITHUB_WORKSPACE/h06_temp')#" /tmp/b06a.py
          python /tmp/b06a.py
          cp h06_temp/make_batch03_hard_review.py /tmp/hard06a.py
          sed -i 's/range(36,52)/range(99,113)/' /tmp/hard06a.py
          sed -i "s#ROOT=pathlib.Path(__file__).resolve().parent#ROOT=pathlib.Path('$GITHUB_WORKSPACE/h06_temp')#" /tmp/hard06a.py
          python /tmp/hard06a.py
      - run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_packets h06_temp/t0_review
          git diff --cached --quiet || git commit -m "Generate H06 Health Care blind evidence 99-112"
          git pull --rebase origin h06-manifest-verification-temp
          git push
