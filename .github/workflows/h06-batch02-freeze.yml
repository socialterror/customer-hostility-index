name: H06 Freeze Batch02 T0 Scoring
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - 'h06_temp/build_batch02_scoring_artifacts.py'
      - 'h06_temp/t0_scoring/batch02_company_scores.csv'
      - '.github/workflows/h06-batch02-freeze.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python h06_temp/build_batch02_scoring_artifacts.py
      - run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_scoring
          git diff --cached --quiet || git commit -m "Freeze H06 Batch02 blind T0 scoring"
          git push
