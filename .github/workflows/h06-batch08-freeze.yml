name: H06 Batch08 IT Freeze
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - 'h06_temp/freeze_batch08_it.py'
      - '.github/workflows/h06-batch08-freeze.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python h06_temp/freeze_batch08_it.py
      - run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_scoring
          git diff --cached --quiet || git commit -m "Freeze H06 IT blind T0 batch"
          git pull --rebase origin h06-manifest-verification-temp
          git push
