name: H06 Batch04 Energy Blind Packets and Hard Review
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - '.github/workflows/h06-batch04-energy.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build exact frozen packets orders 52-62
        run: |
          cp h06_temp/build_t0_packets.py /tmp/batch04.py
          sed -i 's/MIN_ORDER=10/MIN_ORDER=52/' /tmp/batch04.py
          sed -i 's/MAX_ORDER=35/MAX_ORDER=62/' /tmp/batch04.py
          sed -i 's/packet_summary_batch02.csv/packet_summary_batch04.csv/' /tmp/batch04.py
          sed -i "s#ROOT=pathlib.Path(__file__).resolve().parent#ROOT=pathlib.Path('$GITHUB_WORKSPACE/h06_temp')#" /tmp/batch04.py
          python /tmp/batch04.py
      - name: Build explicit mechanism reviews
        run: |
          cp h06_temp/make_batch03_hard_review.py /tmp/hard04.py
          sed -i 's/range(36,52)/range(52,63)/' /tmp/hard04.py
          sed -i "s#ROOT=pathlib.Path(__file__).resolve().parent#ROOT=pathlib.Path('$GITHUB_WORKSPACE/h06_temp')#" /tmp/hard04.py
          python /tmp/hard04.py
      - name: Commit outputs
        run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_packets h06_temp/t0_review
          git diff --cached --quiet || git commit -m "Generate H06 Batch04 Energy blind evidence"
          git push
