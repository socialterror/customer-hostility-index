name: H06 Batch03 Consumer Staples Packets
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - '.github/workflows/h06-batch03-packets.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build exact frozen packets orders 36-51
        shell: bash
        run: |
          cp h06_temp/build_t0_packets.py /tmp/batch03.py
          sed -i 's/MIN_ORDER=10/MIN_ORDER=36/' /tmp/batch03.py
          sed -i 's/MAX_ORDER=35/MAX_ORDER=51/' /tmp/batch03.py
          sed -i "s/packet_summary_batch02.csv/packet_summary_batch03.csv/" /tmp/batch03.py
          sed -i "s#ROOT=pathlib.Path(__file__).resolve().parent#ROOT=pathlib.Path('$GITHUB_WORKSPACE/h06_temp')#" /tmp/batch03.py
          python /tmp/batch03.py
      - name: Commit packets
        run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_packets
          git diff --cached --quiet || git commit -m "Generate H06 Batch03 Consumer Staples blind packets"
          git push
