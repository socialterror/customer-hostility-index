name: H06 Batch10 Real Estate Blind Evidence
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - '.github/workflows/h06-batch10-realestate.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          cp h06_temp/build_t0_packets.py /tmp/b10.py
          sed -i 's/MIN_ORDER=10/MIN_ORDER=198/' /tmp/b10.py
          sed -i 's/MAX_ORDER=35/MAX_ORDER=213/' /tmp/b10.py
          sed -i 's/packet_summary_batch02.csv/packet_summary_batch10.csv/' /tmp/b10.py
          sed -i "s#ROOT=pathlib.Path(__file__).resolve().parent#ROOT=pathlib.Path('$GITHUB_WORKSPACE/h06_temp')#" /tmp/b10.py
          python /tmp/b10.py
      - run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_packets h06_temp/t0_packets/packet_summary_batch10.csv
          git diff --cached --quiet || git commit -m "Generate H06 Real Estate blind evidence"
          git pull --rebase origin h06-manifest-verification-temp
          git push
# triggered
