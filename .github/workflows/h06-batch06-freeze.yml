name: H06 Batch06 Health Care Freeze
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - 'h06_temp/freeze_batch06_health.py'
      - '.github/workflows/h06-batch06-freeze.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python h06_temp/freeze_batch06_health.py
      - run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_scoring/H06_T0_COMPANY_PREDICTOR_LEDGER_BATCH06_FROZEN.csv h06_temp/t0_scoring/H06_T0_SIGNAL_LEDGER_WORKING_BATCH06_HEALTH_CARE.csv h06_temp/t0_scoring/H06_T0_BATCH06_FREEZE_NOTE.md h06_temp/t0_scoring/H06_T0_BATCH06_CHECKSUMS.txt h06_temp/t0_scoring/batch06_status.json
          git diff --cached --quiet || git commit -m "Freeze H06 Batch06 Health Care T0 scoring"
          git pull --rebase origin h06-manifest-verification-temp
          git push
