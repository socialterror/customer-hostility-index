name: H06 Batch08 IT Compact Review
on:
  push:
    branches: [h06-manifest-verification-temp]
    paths:
      - 'h06_temp/make_batch08_it_compact.py'
      - '.github/workflows/h06-batch08-compact.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python h06_temp/make_batch08_it_compact.py
      - run: |
          git config user.name "h06-t0-bot"
          git config user.email "actions@users.noreply.github.com"
          git add h06_temp/t0_review/batch08_it_compact.tsv h06_temp/t0_review/batch08_split
          git diff --cached --quiet || git commit -m "Build H06 IT compact blind review"
          git pull --rebase origin h06-manifest-verification-temp
          git push
